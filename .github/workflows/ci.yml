name: CI

on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # 前端必须先行：go:embed 在编译期要求 dist 产物存在
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .

      - name: Build frontend
        run: npm run build-only

      - name: Test frontend
        run: npx vitest run

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Lint (golangci)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
